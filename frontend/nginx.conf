# OctoGuide 前端站点配置（容器内 /etc/nginx/conf.d/default.conf）。
# 职责：提供 Vue 静态资源（含 SPA 路由回退），并把 /api 反向代理到后端容器。

server {
    listen 80;
    server_name _;

    # 用 Docker 内置 DNS（127.0.0.11）在“请求时”解析 backend。
    # 不用 upstream 块：upstream 在启动时就解析域名，后端未就绪会导致 nginx 直接启动失败（崩溃重启）。
    # 配合 proxy_pass 中的变量，可让 nginx 先正常启动，后端恢复后自动重新解析。
    resolver 127.0.0.11 valid=10s ipv6=off;

    charset utf-8;
    root /usr/share/nginx/html;
    index index.html;

    # 构建产物带内容哈希，可长期缓存；index.html 必须每次校验，避免升级后拿到旧壳。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 回退：非静态资源路径统一交给 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 变量形式的 proxy_pass 才会走上面的 resolver：后端重启/换 IP 后无需重启 nginx。
        # 变量写法不自动传递 URI 后缀，故需手动补上 $request_uri，保证 /api/chat 等路径原样转发。
        proxy_pass http://backend:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # /api/chat 返回 NDJSON 流式响应：关闭缓冲，否则回答会攒到最后一次性吐出。
        # gzip 同样会缓冲，故在该路径整体关闭。
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        gzip off;

        # 与后端 octoguide.chat.emitter-timeout-seconds（默认 300s）匹配，并留出余量。
        proxy_connect_timeout 10s;
        proxy_send_timeout    360s;
        proxy_read_timeout    360s;
    }

    # 大模型回答可能较长，关闭静态压缩例外，统一开启 gzip 降低传输量。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
}
