# OctoGuide 一键部署：MySQL 8 + Spring Boot 后端 + Nginx 前端。
#
# 使用方式：
#   copy .env.example .env   # 再按需修改数据库密码与 LLM 密钥
#   docker compose up -d --build
#   # 浏览器打开 http://localhost:8088
#
# 端口：前端 8088（避开后端 8080）、MySQL 3307（避开宿主机已有 MySQL 3306）。
# 排障提示：若容器起不来，先看 docker compose logs -f backend。

name: octoguide

services:
  db:
    image: mysql:8.0
    container_name: octoguide-db
    restart: unless-stopped
    command:
      # utf8mb4 保证中文与 emoji（分类图标）可存；表名大小写不敏感，避免跨平台差异。
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --lower_case_table_names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-octoguide}
      MYSQL_USER: ${OCTOGUIDE_DB_USERNAME:-octoguide}
      MYSQL_PASSWORD: ${OCTOGUIDE_DB_PASSWORD:?请在 .env 中设置 OCTOGUIDE_DB_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      # 仅绑定回环地址：数据库不必对局域网暴露。需要远程连接时改成 "3307:3306"。
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次创建数据卷时按文件名顺序执行，负责建表 + 种子数据 + Flyway 基线。
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 用应用账号做真实查询，确保库与账号都就绪，而不只是进程存活。
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - octoguide

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: octoguide-backend:0.1.0
    container_name: octoguide-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: "8080"
      OCTOGUIDE_DB_URL: "jdbc:mysql://db:3306/${MYSQL_DATABASE:-octoguide}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      OCTOGUIDE_DB_USERNAME: ${OCTOGUIDE_DB_USERNAME:-octoguide}
      OCTOGUIDE_DB_PASSWORD: ${OCTOGUIDE_DB_PASSWORD:?请在 .env 中设置 OCTOGUIDE_DB_PASSWORD}
      # LLM：留空则不接入大模型，聊天自动回退到本地知识库。
      OCTOGUIDE_LLM_BASE_URL: ${OCTOGUIDE_LLM_BASE_URL:-https://api.openai.com/v1}
      OCTOGUIDE_LLM_KEY: ${OCTOGUIDE_LLM_KEY:-}
      OCTOGUIDE_LLM_MODEL: ${OCTOGUIDE_LLM_MODEL:-gpt-4o-mini}
      OCTOGUIDE_LLM_TIMEOUT_SECONDS: ${OCTOGUIDE_LLM_TIMEOUT_SECONDS:-30}
      # 联网研究（时效性问题抓取网页）开关。
      OCTOGUIDE_WEB_RESEARCH_ENABLED: ${OCTOGUIDE_WEB_RESEARCH_ENABLED:-true}
      # 知识更新接口令牌；留空则 /api/knowledge/update 不可用。
      OCTOGUIDE_KNOWLEDGE_UPDATE_TOKEN: ${OCTOGUIDE_KNOWLEDGE_UPDATE_TOKEN:-}
      OCTOGUIDE_CHAT_EMITTER_TIMEOUT_SECONDS: ${OCTOGUIDE_CHAT_EMITTER_TIMEOUT_SECONDS:-300}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m -Dfile.encoding=UTF-8}
      TZ: Asia/Shanghai
    ports:
      # 需要直接调后端 API / 看接口文档时可用；只走前端页面也可以删掉这段。
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    networks:
      - octoguide

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: octoguide-frontend:0.1.0
    container_name: octoguide-frontend
    restart: unless-stopped
    depends_on:
      backend:
        # 后端健康检查（/api/status）通过后再起前端，避免首屏请求 502。
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8088}:80"
    networks:
      - octoguide

volumes:
  mysql-data:
    name: octoguide-mysql-data

networks:
  octoguide:
    name: octoguide-net
